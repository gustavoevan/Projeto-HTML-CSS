<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Estudantes desenvolvendo um sistema web</title>
  <desc id="descricao">Ilustração vetorial com computador, código, gráficos e elementos educacionais.</desc>

  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2e4d"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="tela" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#fundo)"/>

  <!-- Formas decorativas do fundo -->
  <circle cx="140" cy="90" r="72" fill="#ffffff" opacity="0.08"/>
  <circle cx="1460" cy="440" r="150" fill="#ffffff" opacity="0.07"/>
  <path d="M0 430 C300 350 560 520 850 425 C1120 335 1340 405 1600 310 L1600 520 L0 520 Z" fill="#0f172a" opacity="0.22"/>

  <!-- Painel de código -->
  <g transform="translate(870 74)">
    <rect x="0" y="0" rx="24" width="590" height="360" fill="#0f172a" opacity="0.93"/>
    <rect x="0" y="0" rx="24" width="590" height="54" fill="#1e293b"/>
    <circle cx="32" cy="27" r="8" fill="#ef4444"/>
    <circle cx="58" cy="27" r="8" fill="#f59e0b"/>
    <circle cx="84" cy="27" r="8" fill="#22c55e"/>

    <text x="42" y="105" fill="#7dd3fc" font-family="monospace" font-size="26">&lt;main class="conteudo"&gt;</text>
    <text x="72" y="153" fill="#c4b5fd" font-family="monospace" font-size="25">&lt;form&gt;</text>
    <text x="102" y="201" fill="#f8fafc" font-family="monospace" font-size="24">input, label, button</text>
    <text x="72" y="249" fill="#c4b5fd" font-family="monospace" font-size="25">&lt;/form&gt;</text>
    <text x="42" y="297" fill="#7dd3fc" font-family="monospace" font-size="26">&lt;/main&gt;</text>

    <rect x="410" y="92" width="120" height="18" rx="9" fill="#22c55e"/>
    <rect x="410" y="127" width="84" height="18" rx="9" fill="#38bdf8"/>
    <rect x="410" y="162" width="140" height="18" rx="9" fill="#f59e0b"/>
    <rect x="410" y="197" width="100" height="18" rx="9" fill="#a78bfa"/>
  </g>

  <!-- Notebook -->
  <g transform="translate(140 110)">
    <rect x="0" y="0" width="520" height="305" rx="22" fill="#e2e8f0"/>
    <rect x="22" y="22" width="476" height="250" rx="10" fill="url(#tela)"/>

    <!-- Interface simplificada -->
    <rect x="48" y="48" width="426" height="40" rx="8" fill="#16324f"/>
    <rect x="48" y="108" width="112" height="135" rx="10" fill="#dbeafe"/>
    <rect x="180" y="108" width="294" height="135" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="204" y="133" width="168" height="15" rx="7" fill="#94a3b8"/>
    <rect x="204" y="168" width="230" height="18" rx="7" fill="#cbd5e1"/>
    <rect x="204" y="202" width="110" height="22" rx="7" fill="#16a34a"/>

    <path d="M-45 305 H565 L625 370 H-105 Z" fill="#cbd5e1"/>
    <rect x="205" y="325" width="110" height="20" rx="10" fill="#94a3b8"/>
  </g>

  <!-- Ícones educacionais -->
  <g opacity="0.95">
    <circle cx="720" cy="118" r="46" fill="#ffffff"/>
    <text x="687" y="133" fill="#2563eb" font-family="Arial, sans-serif" font-size="48" font-weight="bold">{ }</text>

    <circle cx="768" cy="355" r="54" fill="#ffffff"/>
    <path d="M736 363 L758 385 L802 335" fill="none" stroke="#16a34a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
